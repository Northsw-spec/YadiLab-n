name: YadiLab required CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yadilab-required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-and-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install exact locked npm dependencies
        run: npm ci
      - name: Focused Engine, import, dependency and release provenance regressions
        run: |
          set -Eeuo pipefail
          node tests/dependencies/run_dependency_tests.mjs
          node tests/dependencies/run_dependency_adversarial.mjs
          # Compile-time Foundation test semantics are a durable release gate.
          # A valid JSON schema alone does not reject dangling test subjects,
          # ignored port arrays, or an invalid protocol being defaulted.
          npm run test:compiler
          npm run test:engine
          npm run test:enterprise-import
          # ATLAS-001 G5.0: immutable DOCX bytes, source locators and the
          # structure-only truth boundary. Physical pagination runs in the
          # existing Chromium job after its renderer install.
          node tests/enterprise-import/run_atlas001_g5_0_fixture_tests.mjs
          npm run test:import-helper
          # PROJECT-086: canonical focus paging/counts and topology-aware 10k fallback.
          npm run test:topology-navigation
          npm run test:project088-topology
          npm run test:project089-import-consent
          npm run test:project090-hierarchy
          npm run test:project091-layout
          npm run test:project091-edge-renderer
          npm run test:project093-contract
          npm run test:project094-engine
          npm run test:scale001-p0-source
          npm run test:scale001-p4b1-hierarchical
          node tests/browser/run_scale001_p4b1_10000_bounded_source_frozen_tests.mjs
          # Canonical Builder edits must not lose asset identity or overwrite links.
          npm run test:builder-inspector
          # Unapplied Inspector/JSON draft text must not disappear behind Save.
          node tests/browser/run_builder_draft_guard_tests.mjs
          # Canonical solutions must be safe to Apply, compile, save and execute.
          # Builder Inspector already compiled the actual browser commands.
          node tests/browser/run_builder_authoring_tests.mjs
          node tests/browser/run_builder_authoring_adversarial.mjs
          # ReactFlow events must not restore an old source after Inspector Apply.
          node tests/browser/run_topology_workspace_guard_tests.mjs
          npm run test:release-identity
          npm run test:troubleshooting-summary
          npm run test:layered-incident
          node tests/browser/run_project_document_tests.mjs
          ./node_modules/.bin/tsc -p tests/tsconfig.persistence.json
          node tests/persistence/run_indexeddb_commit_tests.mjs
          go test ./launcher/...
      - name: Build and attest source-controlled browser release
        env:
          YADILAB_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          npm run build:browser
          node scripts/verify_browser_release.mjs
          node scripts/verify_release_identity.mjs
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
  browser-regressions:
    uses: ./.github/workflows/browser-tests.yml
  yadilab-required-ci:
    if: ${{ always() }}
    needs: [source-and-security, browser-regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed unless source and Chromium both succeed
        env:
          SOURCE_RESULT: ${{ needs.source-and-security.result }}
          BROWSER_RESULT: ${{ needs.browser-regressions.result }}
        run: |
          set -Eeuo pipefail
          test "$SOURCE_RESULT" = success
          test "$BROWSER_RESULT" = success
          echo "PASS: exact-commit Ubuntu source, security and Chromium."
