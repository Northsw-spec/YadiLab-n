name: YadiLab actual Chromium
on:
  workflow_call:
permissions:
  contents: read
jobs:
  compiled-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies and build actual app
        env:
          YADILAB_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build:browser
          node scripts/verify_browser_release.mjs
      - name: Install one pinned Chromium
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/yadilab-playwright"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" -m pip install --disable-pip-version-check 'playwright==1.55.0'
          "$RUNNER_TEMP/yadilab-playwright/bin/python" -m playwright install --with-deps chromium
      - name: Mounted UI identity, import truth and reviewed graph
        env:
          YADILAB_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 -m http.server 18981 --bind 127.0.0.1 --directory ui/dist >"$RUNNER_TEMP/yadilab-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18981/build-marker.json >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18981/build-marker.json >/dev/null
          mkdir -p "$RUNNER_TEMP/yadilab-evidence"
          node tests/browser/run_project080_tcp_interpretation_tests.mjs
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_release_identity_real_browser.py \
            --url http://127.0.0.1:18981/ --expected-commit "$YADILAB_EXPECTED_COMMIT" \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/identity"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_ic020_p2c5_truth_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/import-truth"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_ic030_p2b_drawio_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/drawio"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project_file_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project-file"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project_postwrite_hash_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project-postwrite-hash"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_builder_late_draft_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/builder-late-draft"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_async_lab_draft_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/async-lab-drafts"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_curriculum_context_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/curriculum-context"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project078_reset_troubleshooting_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project078-reset-troubleshooting"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project079_dns_troubleshooting_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project079-dns-troubleshooting"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project080_root_cause_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project080-root-cause"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project081_first_click_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project081-first-click"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project082_troubleshooting_summary_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project082-troubleshooting-summary"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project083_click_to_diagnose_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project083-click-to-diagnose"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project084_next_check_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project084-next-check"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project085_layered_incident_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project085-layered-incident"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_package_export_draft_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/package-draft-export"
          # PROJECT-086: topology navigation semantics plus real 10k/10k XLSX Chromium proof.
          npm run test:topology-navigation
          npm run test:scale001-p0-source
          npm run test:scale001-p4b1-hierarchical
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project086_topology_explorer_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project086-topology-explorer"
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project086_hierarchical_xlsx_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project086-hierarchical-xlsx"
          # PROJECT-087: bounded enterprise overview and both explicit legacy workbook profiles.
          "$RUNNER_TEMP/yadilab-playwright/bin/python" tests/acceptance/run_project087_enterprise_topology_real_browser.py \
            --url http://127.0.0.1:18981/ \
            --evidence-dir "$RUNNER_TEMP/yadilab-evidence/project087-enterprise-topology"
          # PROJECT-088: canonical normal-topology model invariants.
          npm run test:project088-topology
      - name: Persist Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yadilab-chromium-evidence
          path: ${{ runner.temp }}/yadilab-evidence/
          if-no-files-found: ignore
