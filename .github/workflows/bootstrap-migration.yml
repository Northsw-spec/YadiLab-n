name: One-time YadiLab source migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-migration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-pinned-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout new repository with permission to push application code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Import pinned original application without old CI or abandoned project-save PR
        env:
          SOURCE_COMMIT: 785683d62cf93e0599b439c513dcb7a28f79aab8
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          test -f .migration/required-ci.yml
          test -f .migration/browser-tests.yml
          test -f .migration/release.yml
          test -f .migration/AGENTS.md
          cp -a .migration "$tmp/migration"
          cp README.md "$tmp/README.md"
          cp .github/workflows/bootstrap-migration.yml "$tmp/bootstrap-migration.yml"
          git clone --quiet --no-checkout https://github.com/Northsw-spec/YadiLab.git "$tmp/source"
          git -C "$tmp/source" checkout --quiet --detach "$SOURCE_COMMIT"
          test "$(git -C "$tmp/source" rev-parse HEAD)" = "$SOURCE_COMMIT"
          source_files="$(git -C "$tmp/source" ls-tree -r --name-only HEAD | wc -l)"
          test "$source_files" -ge 1400
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          git -C "$tmp/source" archive "$SOURCE_COMMIT" | tar -xf - -C .
          rm -rf .github
          mkdir -p .github/workflows
          cp "$tmp/bootstrap-migration.yml" .github/workflows/bootstrap-migration.yml
          cp -a "$tmp/migration" .migration
          cp "$tmp/README.md" README.md
          cp .migration/AGENTS.md AGENTS.md
          rm -rf tests/ci scripts/ci
          rm -f scripts/ci-*.sh
          if test -d docs; then
            find docs -type f -name '*.md' -delete
            find docs -depth -type d -empty -delete
          fi
          test -f ui/app/main.mjs
          test -f scripts/build_browser_app.mjs
          test -f tests/acceptance/run_release_identity_real_browser.py
          test -f package-lock.json
          test ! -e ui/app/project-document.mjs
          test "$(find .github/workflows -maxdepth 1 -name '*.yml' -type f | wc -l)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet -- .github/workflows/bootstrap-migration.yml
          git commit -m "chore: import pinned full YadiLab application source without legacy CI"
          git push origin HEAD:main
          echo "MIGRATION_SOURCE_IMPORTED source=$SOURCE_COMMIT"
          echo "Next: install three staged workflow templates using the GitHub connector and delete bootstrap."
